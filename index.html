<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 Choty Party</title>
    <style>
        /* 깔끔한 블랙앤화이트 & 트렌디한 폰트 세팅 */
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        
        body, html { 
            margin: 0; padding: 0; 
            background-color: #000; color: #fff; 
            font-family: 'Pretendard', sans-serif; 
            overflow-x: hidden; 
        }
        
        /* 각 섹션을 화면 꽉 차게 설정 */
        section { 
            height: 100vh; 
            display: flex; flex-direction: column; 
            justify-content: center; align-items: center; 
            text-align: center; 
            border-bottom: 1px solid #222; /* 구분선 아주 얇게 */
        }

        h1 { font-size: 4rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: -2px; }
        h2 { font-size: 1.5rem; font-weight: 500; opacity: 0.9; margin-bottom: 2rem; }
        p { font-size: 1rem; font-weight: 300; opacity: 0.6; }
        
        /* 미니멀한 인풋과 버튼 디자인 */
        input {
            background: transparent; border: none; border-bottom: 1px solid #fff; 
            color: #fff; padding: 10px; font-size: 1rem; 
            margin-top: 20px; outline: none; text-align: center;
        }
        input::placeholder { color: #555; }
        
        button { 
            background: transparent; border: 1px solid #fff; 
            color: #fff; padding: 12px 30px; font-size: 1rem; 
            margin-top: 20px; outline: none; transition: 0.3s; 
        }
        button:hover { background: #fff; color: #000; cursor: pointer; }
    </style>
</head>
<body>

    <section id="main">
        <h1>1/1</h1>
        <p>2026 초티파티에 초대합니다.</p>
        <button id="enterBtn">입장하기</button>
    </section>

    </section>

    <section id="year-2025">

        </section>

    <section id="year-2026">

        <div style="display: flex; flex-direction: column; align-items: center; gap: 10px;">
            <input type="text" id="inviteCode" placeholder="초대 코드 입력">
            <button id="submitCode">입장하기</button>
